name: C++ Windows Tests

on:
  push:
    branches: [main]
    paths-ignore: [test_report.md]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Load Windows SDK and LLVM build environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (!$vs) { throw 'Visual Studio was not found' }
          $arch = if ('${{ matrix.arch }}' -eq 'x64') { 'x64' } else { 'x86' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          $originalPath = $env:Path -split ';'
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=x64"
          $paths = @($env:Path -split ';' | Where-Object { $_ -and $_ -notin $originalPath })
          [array]::Reverse($paths)
          foreach ($directory in $paths) { Add-Content -LiteralPath $env:GITHUB_PATH -Value $directory }
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (!$value) { throw "Developer environment did not define $name" }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value"
          }
          Get-Command ninja | Select-Object Name, Source

      - name: Configure
        id: configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force out/test-logs | Out-Null
          $env:Path = ($env:Path -split ';' | Where-Object {
            $_ -and !(Test-Path (Join-Path $_ 'clang-cl.exe')) -and !(Test-Path (Join-Path $_ 'lld-link.exe'))
          }) -join ';'
          if (Get-Command clang-cl, lld-link -ErrorAction SilentlyContinue) {
            throw 'LLVM executables are still in PATH; this build must test toolchain discovery'
          }
          if ('${{ matrix.arch }}' -eq 'x64') {
            cmake --preset x64-release 2>&1 | Tee-Object out/test-logs/configure.log
          } else {
            cmake -S . -B out/test -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON `
              -DCMAKE_TOOLCHAIN_FILE=cmake/WindowsLLVM.cmake `
              -DCMAKE_CXX_COMPILER_TARGET=i686-pc-windows-msvc 2>&1 | Tee-Object out/test-logs/configure.log
          }
          exit $LASTEXITCODE

      - name: Build
        id: build
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ('${{ matrix.arch }}' -eq 'x64') {
            cmake --build --preset x64-release --parallel 2>&1 | Tee-Object out/test-logs/build.log
          } else {
            cmake --build out/test --parallel 2>&1 | Tee-Object out/test-logs/build.log
          }
          exit $LASTEXITCODE

      - name: Run CTest
        id: ctest
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ('${{ matrix.arch }}' -eq 'x64') {
            ctest --preset x64-release --output-junit test-results.xml 2>&1 | Tee-Object out/test-logs/ctest.log
          } else {
            ctest --test-dir out/test --output-on-failure --no-tests=error --output-junit test-results.xml 2>&1 | Tee-Object out/test-logs/ctest.log
          }
          exit $LASTEXITCODE

      - name: Write Markdown report and Actions summary
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          try {
            ./tests/write_report.ps1
          } catch {
            "# OnThisDayBackground Windows tests", "", "**Report generation failed**", "",
            "Configure: $env:CONFIGURE_OUTCOME / Build: $env:BUILD_OUTCOME / CTest: $env:CTEST_OUTCOME",
            "", ($_ | Out-String) | Set-Content -LiteralPath test_report.md -Encoding utf8
          }
          Get-Content -Raw -LiteralPath test_report.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload report and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            test_report.md
            out/test-logs/
            out/test/test-results.xml
            out/test/Testing/Temporary/
            out/build/x64-release/test-results.xml
            out/build/x64-release/Testing/Temporary/

      - name: Commit x64 report on main
        if: always() && matrix.arch == 'x64' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if (!(Test-Path -LiteralPath test_report.md)) { throw 'Report missing' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test_report.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "docs: update Windows test report [skip ci]"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
